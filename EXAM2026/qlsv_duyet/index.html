<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header><h1>Phòng máy chờ</h1></header>

      

      <button id="open-dialog" class="btn btn-add">+ Thêm phòng</button>

      <table id="student-table">
        <thead>
          <tr>
            <!-- <th>#</th> -->
            <th>Tên phòng</th>
            <th>Mã phòng</th>
            <th>Số máy</th>
            <th>Quản lý</th>
            <th>Email</th>
            
        </thead>
        <tbody></tbody>
      </table>
    </main>

    <dialog id="student-dialog">
      <div class="dialog-header">
        <h2 id="dialog-title">Thêm/Sửa Phòng máy</h2>
      </div>
      <form id="student-form" novalidate>
        <div class="dialog-body">
          <input type="hidden" id="edit-index" />
          <div class="form-group">
            <label>MÃ phòng *</label>
            <input type="text" id="studentId" placeholder="VD: PM123" />
            <span class="error">Định dạng PM + 3 số(PM202).</span>
          </div>
          <div class="form-group">
            <label>Tên phòng *</label>
            <input type="text" id="fullName" />
            <span class="error">Ví dụ phòng thực hành Lập trình web.</span>
          </div>
          <div class="form-group">
            <label>Số máy *</label>
            <input type="number" id="dob" />
            <span class="error">Số nguyên từ 1 đến 60(ví dụ 40).</span>
          </div>
          <div class="form-group">
            <label>Quản lý *</label>
            <input type="text" id="fullName" />
            <span class="error">Họ tên người quản lý phòng.</span>
          </div>
          
          <div class="form-group">
            <label>Email *</label>
            <input type="email" id="email" placeholder="@tlu.edu.vn" />
            <span class="error">Phải đuôi @tlu.edu.vn</span>
          </div>
          
        <div class="dialog-footer">
          <button type="submit" class="btn btn-save">Lưu</button>
          <button type="button" id="close-dialog" class="btn btn-cancel">
            Hủy
          </button>
        </div>
      </form>
    </dialog>

    <script src="jquery.min.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
