<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bảng Điểm Sinh Viên</title>
<style>
body{
    font-family: Arial;
    margin: 30px;
}

input{
    padding:6px;
    margin-right:10px;
}

button{
    padding:6px 10px;
}

table{
    border-collapse: collapse;
    margin-top:20px;
    width:600px;
}

th, td{
    border:1px solid black;
    padding:8px;
    text-align:center;
}

.low-score{
    background-color: yellow;
}

#stats{
    margin-top:10px;
    font-weight:bold;
}
</style>
</head>

<body>

<h2>Quản Lý Điểm Sinh Viên</h2>

<input type="text" id="name" placeholder="Họ tên">
<input type="number" id="score" placeholder="Điểm (0-10)">
<button id="addBtn">Thêm</button>

<table>
<thead>
<tr>
<th>STT</th>
<th>Họ tên</th>
<th>Điểm</th>
<th>Xếp loại</th>
<th>Thao tác</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>

<div id="stats">
Tổng sinh viên: 0 | Điểm trung bình: 0
</div>

<script>

let students = [];

function getRank(score){
    if(score >= 8.5) return "Giỏi";
    if(score >= 7) return "Khá";
    if(score >= 5) return "Trung bình";
    return "Yếu";
}

function renderTable(){

    let tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    let total = 0;

    students.forEach((sv,index)=>{

        total += sv.score;

        let tr = document.createElement("tr");

        if(sv.score < 5){
            tr.classList.add("low-score");
        }

        tr.innerHTML = `
        <td>${index+1}</td>
        <td>${sv.name}</td>
        <td>${sv.score}</td>
        <td>${getRank(sv.score)}</td>
        <td>
            <button data-index="${index}">Xóa</button>
        </td>
        `;

        tbody.appendChild(tr);
    });

    let avg = students.length ? (total/students.length).toFixed(2) : 0;

    document.getElementById("stats").textContent =
    `Tổng sinh viên: ${students.length} | Điểm trung bình: ${avg}`;
}

function addStudent(){

    let name = document.getElementById("name").value.trim();
    let score = parseFloat(document.getElementById("score").value);

    if(name === "" || isNaN(score) || score < 0 || score > 10){
        alert("Dữ liệu không hợp lệ!");
        return;
    }

    students.push({
        name:name,
        score:score
    });

    renderTable();

    document.getElementById("name").value="";
    document.getElementById("score").value="";

    document.getElementById("name").focus();
}

document.getElementById("addBtn").addEventListener("click", addStudent);

document.getElementById("score").addEventListener("keypress",function(e){
    if(e.key === "Enter"){
        addStudent();
    }
});

document.getElementById("tableBody").addEventListener("click",function(e){

    if(e.target.tagName === "BUTTON"){

        let index = e.target.dataset.index;

        students.splice(index,1);

        renderTable();
    }
});

</script>

</body>
</html>
